name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter vite-plugin-json5 run test

      - name: Build package
        run: pnpm --filter vite-plugin-json5 run build

      - name: Pack package
        run: pnpm --filter vite-plugin-json5 pack --pack-destination /tmp/npm-pack

      - name: Upload package to release
        run: gh release upload ${{ github.event.release.tag_name }} /tmp/npm-pack/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to NPM
        run: pnpm --filter vite-plugin-json5 publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
