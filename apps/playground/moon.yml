$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript
layer: application

dependsOn:
  - 'vite-plugin-json5'

tasks:
  dev:
    command: 'pnpm run dev'
    preset: server
    deps:
      - 'vite-plugin-json5:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'

  build:
    command: 'pnpm run build'
    deps:
      - 'vite-plugin-json5:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
    outputs:
      - 'dist'

  lint:
    command: 'pnpm run lint'
    deps:
      - 'vite-plugin-json5:lint'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'eslint.config.js'
